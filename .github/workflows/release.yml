name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Verify version and build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -F "version = \"$version\"" polypay-checkout/build.gradle.kts
          ./gradlew testDebugUnitTest lint assembleRelease
      - name: Publish GitHub Package
        run: ./gradlew publishReleasePublicationToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package checksum
        shell: bash
        run: sha256sum polypay-checkout/build/outputs/aar/polypay-checkout-release.aar > polypay-checkout-release.aar.sha256
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: polypay-checkout/build/outputs/aar/polypay-checkout-release.aar
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            polypay-checkout/build/outputs/aar/polypay-checkout-release.aar
            polypay-checkout-release.aar.sha256
