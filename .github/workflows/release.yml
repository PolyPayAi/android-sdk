name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify version and build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -F "version = \"$version\"" polypay-checkout/build.gradle.kts
          ./gradlew testDebugUnitTest lint assembleRelease
      - name: Publish GitHub Package
        run: ./gradlew publishReleasePublicationToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package checksum
        shell: bash
        run: sha256sum polypay-checkout/build/outputs/aar/polypay-checkout-release.aar > polypay-checkout-release.aar.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: polypay-checkout/build/outputs/aar/polypay-checkout-release.aar
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            polypay-checkout/build/outputs/aar/polypay-checkout-release.aar
            polypay-checkout-release.aar.sha256
